<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiendita de Maquillaje - Venta Relámpago</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>💄 Tiendita de Maquillaje</h1>
    <p>Venta relámpago · Cliente de la API FastAPI</p>
  </header>

  <main>
    <section id="estado" class="mensaje" aria-live="polite"></section>

    <section>
      <h2>Catálogo</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Producto</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </section>

    <section>
      <h2>Agregar producto</h2>
      <form id="formulario">
        <input id="nombre" placeholder="Nombre" required>
        <input id="precio" type="number" step="0.01" min="0.01" placeholder="Precio" required>
        <input id="cantidad" type="number" min="0" placeholder="Cantidad" required>
        <button type="submit">Agregar</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
